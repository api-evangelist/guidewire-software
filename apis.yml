aid: guidewire-software
name: Guidewire Software
description: >-
  Guidewire Software provides the cloud platform that Property & Casualty (P&C)
  insurers run on, spanning policy administration (PolicyCenter), claims
  management (ClaimCenter), billing (BillingCenter), pricing (PricingCenter), and
  the all-in-one InsuranceNow platform, all delivered on Guidewire Cloud. The
  company serves more than 570 insurers across 40 countries and exposes Cloud
  APIs (REST) plus an app framework and marketplace so partners and customers can
  integrate policy, claims, and billing data, automate workflows, and extend the
  InsuranceSuite applications. Guidewire's developer program offers documentation,
  a developer community, DEVHack hackathon, and a partner marketplace of
  ready-built integrations and accelerators for the insurance ecosystem.
